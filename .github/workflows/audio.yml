name: YouTube Audio to Telegram

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

jobs:
  download-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg deno
          python -m pip install -U yt-dlp

      - name: Download audio
        run: |
          yt-dlp \
            --js-runtimes deno \
            --no-playlist \
            -x \
            --audio-format mp3 \
            --audio-quality 128K \
            -o "audio.%(ext)s" \
            "${{ inputs.video_url }}"

      - name: Send audio to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          curl -F "chat_id=$CHAT_ID" \
               -F "audio=@audio.mp3" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendAudio"
